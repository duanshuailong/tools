# nginx reverse proxy for IsoFactory.
# Serves the built React frontend (frontend/dist) and proxies /api to the Go
# backend on 127.0.0.1:8080. This is also where you add TLS and access control,
# since the backend itself has no authentication.
#
# Install: copy into /etc/nginx/sites-available/, symlink into sites-enabled/,
# then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;   # replace with your domain

    # Serve the built frontend.
    root /opt/isofactory/frontend/dist;
    index index.html;

    # SPA fallback: unknown routes return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API to the backend.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ISO downloads and long build logs need generous timeouts / no buffering.
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # ISO files are large; raise the body/response limits accordingly.
    client_max_body_size 8g;

    # TODO: add auth here before exposing publicly, e.g.:
    #   auth_basic "IsoFactory";
    #   auth_basic_user_file /etc/nginx/.htpasswd;
    # and TLS via certbot (listen 443 ssl; ...).
}
